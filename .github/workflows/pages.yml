name: pages
on:
  push:
    branches: [master, main]
    # The book includes docs/PLAN.md verbatim, so a plan edit must redeploy too.
    paths: ['site/**', 'docs/PLAN.md', '.github/workflows/pages.yml']
  workflow_dispatch:

# The deployment needs to write a Pages artifact and claim an id-token; nothing
# else in the repo does, so the permissions are scoped to this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so a second push supersedes an in-flight deploy rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # First, so a Pages misconfiguration fails in seconds rather than after
      # the toolchain and mdbook have been installed. `enablement` turns Pages
      # on for the repository if it is off, which is what the first run of this
      # workflow on a fresh repo needs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned: an mdbook minor release can change the generated HTML, and a
      # docs site is not the place to find that out from a red build.
      - run: cargo install mdbook --locked --version 0.5.4
      - run: mdbook build site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book
      - id: deploy
        uses: actions/deploy-pages@v4
