name: pages
on:
  push:
    branches: [master, main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# The deployment needs to write a Pages artifact and claim an id-token; nothing
# else in the repo does, so the permissions are scoped to this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so a second push supersedes an in-flight deploy rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
