name: release

# A release is cut by pushing a tag:
#
#     git tag -a v0.0.1 -m 'Haven 0.0.1' && git push origin v0.0.1
#
# Everything downstream — the installer, both AUR packages — reads what this
# job uploads, so the asset names are a contract and not a detail. Changing
# one breaks `install.sh` and `packaging/aur/refresh.sh` together.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Not `ubuntu-latest`. The binary links glibc, and a binary built against
    # a newer one will not start on an older system — so the runner is pinned
    # to the oldest supported image rather than following whatever GitHub
    # promotes. glibc 2.35 is the floor this sets.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: The tag and the manifest must agree
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "v$manifest" ]; then
            echo "tag $tag does not match workspace version $manifest" >&2
            echo "A release whose binary reports a different version than its" >&2
            echo "name is a bug report nobody can place." >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_ENV"

      # `--locked` so the release is built from the lockfile in the tag and
      # not from whatever has since been published.
      - run: cargo build --release --locked -p haven

      - name: Stage the tarball
        run: |
          target=x86_64-unknown-linux-gnu
          dir="haven-${{ env.version }}-$target"
          mkdir -p "$dir"
          cp target/release/haven "$dir/"
          strip "$dir/haven"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp packaging/haven.desktop packaging/haven.svg "$dir/"
          cp packaging/tarball-install.sh "$dir/install.sh"
          chmod +x "$dir/install.sh"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > SHA256SUMS
          # The installer is fetched on its own, before any tarball exists, so
          # it is an asset in its own right as well as a file in the tree.
          cp install.sh haven-install.sh
          sha256sum haven-install.sh >> SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          target=x86_64-unknown-linux-gnu
          notes=$(cat <<'MD'
          ## Install

          ```sh
          curl -fsSL https://github.com/Lanpingner/Haven/releases/latest/download/haven-install.sh | sh
          ```

          On Arch there is a signed pacman repository, so `pacman -Syu` keeps
          Haven up to date like anything else — see
          [packaging/README.md](https://github.com/Lanpingner/Haven/blob/master/packaging/README.md#the-pacman-repository).
          The AUR packages are `haven-terminal-bin` and `haven-terminal`.

          The binary needs glibc 2.35 or newer. `haven attach` and `haven tui`
          need nothing else; the GPU window loads Vulkan, libxkbcommon and your
          display server's client library at runtime.
          MD
          )
          # Created if it is not there, topped up if it is. A release can be
          # built again — to add an asset a later workflow learned to make,
          # for instance — and a second run that failed on "already exists"
          # would mean cutting a version number to fix packaging.
          # GitHub's API has answered 500 to an asset replace, to a workflow
          # dispatch and to a push's ruleset check, all in one afternoon. A
          # release that has to be driven by hand because the far end was
          # briefly unwell is a release process that does not work.
          retry() {
            n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::gave up after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed, waiting $((n * 10))s"
              sleep $((n * 10))
            done
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            retry gh release upload "$tag" --clobber \
              "haven-${{ env.version }}-$target.tar.gz" \
              haven-install.sh \
              SHA256SUMS
          else
            retry gh release create "$tag" \
              --title "Haven $tag" \
              --notes "$notes" \
              "haven-${{ env.version }}-$target.tar.gz" \
              haven-install.sh \
              SHA256SUMS
          fi

      # Said out loud, because the AUR packages are the half of the release
      # that is not automatic: they live in their own repositories and need
      # the checksums this job has just produced.
      - name: What is left to do by hand
        run: |
          echo "::notice::Now run: packaging/aur/refresh.sh ${{ github.event.inputs.tag || github.ref_name }} && packaging/aur/publish.sh"

  # The same binary again, as a signed pacman package and a one-package
  # repository, uploaded beside it. Adding that repository to pacman.conf is
  # what makes `pacman -Syu` keep Haven up to date without the AUR and
  # without compiling anything.
  #
  # It runs in an Arch container because makepkg, repo-add and pacman-key
  # only exist there, and after the tarball job because it packages what
  # that job published rather than building the binary a second time.
  repo:
    needs: release
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      # -Syu, not -Sy: installing against a database newer than the image's
      # packages is the partial-upgrade trap, and in a container it surfaces
      # as a 404 on a file that was rebuilt since the image was made.
      - run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The runner checks out as its own user and the container runs as
      # root, so git calls the workspace dubious and refuses to read it —
      # which `gh` only discovers when it shells out to git to work out
      # which repository this is.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::The repository is signed, and that needs both the" >&2
            echo "GPG_PRIVATE_KEY and GPG_PASSPHRASE secrets." >&2
            echo "packaging/repo/make-signing-key.sh --push sets them." >&2
            exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'pinentry-mode loopback' > ~/.gnupg/gpg.conf
          echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          [ -n "$key" ] || { echo "::error::the imported key has no secret half" >&2; exit 1; }
          echo "GPG_KEY_ID=$key" >> "$GITHUB_ENV"
          # Warm the agent, so repo-add's own call to gpg does not stop at a
          # passphrase prompt nobody is there to answer. The passphrase is
          # not optional: gpg always protects an exported secret key, and
          # then refuses the empty passphrase it protected it with, so a key
          # with no passphrase cannot be moved here at all.
          echo warm | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --local-user "$key" --sign --output /dev/null
          gpg --armor --export "$key" > haven-repo.pub
          echo "signing with $key"

      - name: Build the package and the repository
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          cd packaging/aur/haven-terminal-bin
          # The checksum in the tree belongs to whatever release came before:
          # `refresh.sh` runs after a release, by hand, for the AUR. Here the
          # asset was published minutes ago by the job this one needs, so the
          # hash is taken from that rather than waited for.
          sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
          # makepkg refuses to run as root, which in a container is who we
          # are — and updpkgsums is makepkg wearing a hat, so it refuses
          # too. Both run as a user made for the purpose.
          useradd -m builder
          chown -R builder .
          sudo -u builder -H updpkgsums
          sudo -u builder -H makepkg --noconfirm --nodeps
          cd "$GITHUB_WORKSPACE"
          mkdir -p repo
          mv packaging/aur/haven-terminal-bin/*.pkg.tar.zst repo/
          cd repo
          # No --passphrase here: an unquoted expansion of one would split on
          # a space, and the import step has already warmed the agent, which
          # is also how repo-add's own call to gpg gets through.
          for pkg in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor --local-user "$GPG_KEY_ID" "$pkg"
          done
          repo-add --sign --key "$GPG_KEY_ID" haven.db.tar.zst *.pkg.tar.zst
          # pacman asks the server for `haven.db`, and repo-add makes that a
          # symlink. A release asset cannot be a symlink, so each one is
          # uploaded as the file it points at.
          for link in haven.db haven.db.sig haven.files haven.files.sig; do
            [ -L "$link" ] && cp -L "$link" "$link.tmp" && mv -f "$link.tmp" "$link"
          done
          ls -la

      - name: Upload the repository to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Named outright, so `gh` has no reason to ask git at all.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cd repo
          retry() {
            n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::gave up after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed, waiting $((n * 10))s"
              sleep $((n * 10))
            done
          }
          retry gh release upload "$tag" --clobber \
            *.pkg.tar.zst *.pkg.tar.zst.sig \
            haven.db haven.db.sig haven.files haven.files.sig \
            "$GITHUB_WORKSPACE/haven-repo.pub"
          echo "::notice::pacman repo published. Server = https://github.com/${{ github.repository }}/releases/latest/download"
