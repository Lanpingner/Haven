[book]
title = "Haven Terminal"
description = "A GPU-accelerated, keyboard-first terminal emulator in Rust with multiplexing built into the core."
authors = ["Haven Terminal contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
# The design plan is included from docs/, which lives outside src/.
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/haven.css"]
additional-js = ["theme/haven.js"]
git-repository-url = "https://github.com/Lanpingner/Haven"
edit-url-template = "https://github.com/Lanpingner/Haven/edit/master/site/{path}"
site-url = "/Haven/"

[output.html.playground]
runnable = false

[output.html.search]
limit-results = 20
