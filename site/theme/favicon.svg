  <rect x="41" y="13" width="8" height="34" rx="2" fill="#6c9cf0"/>
  <rect x="23" y="26" width="18" height="8" rx="2" fill="#c8d0e0"/>
  <rect x="15" y="52" width="34" height="4" rx="2" fill="#6c9cf0"/>
